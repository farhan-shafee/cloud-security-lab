title: IAM and Resource Discovery Burst
id: 343f7daa-94f3-4269-8047-95304cc432ab
status: unsupported
description: >
  Historical discovery-burst sketch using legacy Sigma aggregation syntax.
  Preserved for discussion only: not executed by the Python engine, not
  converted to a backend, and not a supported current Sigma correlation rule.
references:
  - https://attack.mitre.org/techniques/T1580/
author: Farhan Shafee
date: 2026-03-08
modified: 2026-09-23
logsource:
  product: aws
  service: cloudtrail
detection:
  selection:
    eventName|startswith:
      - List
      - Describe
      - GetAccountAuthorizationDetails
  timeframe: 5m
  condition: selection | count() by userIdentity.arn > 50
falsepositives:
  - Backup, inventory, and CSPM tools enumerate constantly (allowlist them)
  - First run of a new automation account
level: low
tags:
  - attack.discovery
  - attack.t1580
