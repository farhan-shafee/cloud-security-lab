title: AWS Console Login Without MFA
id: 39393823-f82e-4ca1-ac7a-09c67cfc4146
status: experimental
description: >
  Reference rule for a successful IAM-user console sign-in with an explicit
  no-MFA signal. The Python detector has its own tested implementation;
  this rule has not been converted or validated against a SIEM backend.
references:
  - https://attack.mitre.org/techniques/T1078/
  - https://docs.aws.amazon.com/awscloudtrail/latest/userguide/cloudtrail-event-reference-record-contents.html
author: Farhan Shafee
date: 2026-03-08
modified: 2026-09-23
logsource:
  product: aws
  service: cloudtrail
detection:
  selection:
    eventSource: signin.amazonaws.com
    eventName: ConsoleLogin
    userIdentity.type: IAMUser
    responseElements.ConsoleLogin: Success
    additionalEventData.MFAUsed: 'No'
  failed:
    errorCode|exists: true
  condition: selection and not failed
falsepositives:
  - Documented break-glass accounts (maintain an allowlist and review monthly)
  - Authorized IAM-user sign-in without MFA still warrants identity hygiene review
level: medium
tags:
  - attack.initial_access
  - attack.t1078
