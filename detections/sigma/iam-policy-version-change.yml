title: IAM Policy Version Change
id: c9351c49-1c36-4377-984a-6d01698297e0
status: experimental
description: >
  Reference rule for successful creation of an IAM policy version or a default
  version change. This does not prove privilege expansion. The Python detector
  is independently tested; this rule has not been validated in a SIEM backend.
references:
  - https://attack.mitre.org/techniques/T1098/
author: Farhan Shafee
date: 2026-03-08
modified: 2026-09-23
logsource:
  product: aws
  service: cloudtrail
detection:
  selection:
    eventSource: iam.amazonaws.com
    eventName:
      - CreatePolicyVersion
      - SetDefaultPolicyVersion
  failed:
    errorCode|exists: true
  condition: selection and not failed
falsepositives:
  - Approved IAM changes inside a maintenance window
  - Infrastructure-as-code deploys (filter on the CI/CD principal ARN)
level: medium
tags:
  - attack.privilege_escalation
  - attack.t1098
