name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Byte-compile the linter
        run: python3 -m py_compile scripts/analyze_policy.py

      - name: Run repo validation
        run: make validate

      - name: Confirm the linter catches the bad policy
        run: |
          if python3 scripts/analyze_policy.py examples/iam/overprivileged-policy.json; then
            echo "linter failed to flag the over-privileged policy" && exit 1
          fi
